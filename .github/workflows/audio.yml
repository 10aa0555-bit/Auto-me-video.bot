name: Generate Video Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "moviepy<2.0" pillow

      # storyboard.json から無音の mp4 を組み立てる(音声生成・API キーは不要)
      - name: Make video from storyboard.json
        run: python make_video.py

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video-mp4
          path: final_output.mp4
