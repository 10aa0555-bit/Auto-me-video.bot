name: Generate Video Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "moviepy<2.0" ffmpeg-python

      - name: Run Audio Script and Make Video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python generate_audio.py
          python make_video.py

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video-mp4
          path: final_output.mp4
