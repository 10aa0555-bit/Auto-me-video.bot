name: Geo Short Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "台本 JSON のパス"
        required: true
        default: "scripts/kaliningrad_en.json"
  # 台本を push すると、変更された台本の動画を自動で作る。
  # コードだけ変えたときはコミットメッセージに [render scripts/xxx.json] と書くと作り直す
  push:
    paths:
      - "scripts/*.json"
      - "geo_short/**"
      - "!geo_short/**/*.md"

permissions:
  contents: write

# 複数の push が重なっても順番に作る (renders ブランチへの push がぶつからないように)
concurrency:
  group: geo-short-renders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick scripts
        id: pick
        env:
          INPUT_SCRIPT: ${{ inputs.script }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$INPUT_SCRIPT"
          else
            list="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'scripts/*.json')"
            list="$list $(printf '%s' "$COMMIT_MSG" | grep -o '\[render [^]]*\]' | sed 's/^\[render //; s/\]$//')"
          fi
          # scripts/ 以下に実在する JSON だけを通す
          ok=""
          for f in $list; do
            case "$f" in scripts/*.json) [ -f "$f" ] && ok="$ok $f" ;; esac
          done
          echo "scripts=$(echo $ok | xargs -n1 | sort -u | xargs)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.pick.outputs.scripts != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.pick.outputs.scripts != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libcairo2-dev pkg-config espeak-ng
          python -m pip install --upgrade pip
          pip install -r geo_short/requirements.txt
          # 無料の音声合成 Kokoro (ElevenLabs のクレジットが足りないときに使う)。CPU 版 PyTorch で軽く
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9" soundfile
          # AI イラストの背景をきれいに消す (無ければ簡易な背景除去で代用)
          pip install "rembg[cpu]" || true

      # 衛星画像・アイコン・国旗・音声モデル・作ったナレーションを次回に持ち越す
      # (毎回新しいキーで保存し、前回分から復元する)
      - name: Restore assets and narration
        if: steps.pick.outputs.scripts != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/geo_short
          key: geo-short-assets-v3-${{ github.run_id }}
          restore-keys: |
            geo-short-assets-v3-
            geo-short-assets-v2

      - name: Restore drawn art
        if: steps.pick.outputs.scripts != ''
        run: python tools/art_cache.py restore

      - name: Build videos
        if: steps.pick.outputs.scripts != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # AI イラスト (どちらか片方あれば使う。無ければ 3D アイコンで代用)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: 4c5c855831c1a7f3ce3d0fa80b9c0d0d  # Cloudflare のアカウント ID (秘密の値ではない)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          export HF_HOME="$HOME/.cache/geo_short/hf"  # Kokoro の音声モデルもキャッシュに入れる
          export U2NET_HOME="$HOME/.cache/geo_short/u2net"  # 背景除去のモデルも
          for s in ${{ steps.pick.outputs.scripts }}; do
            python -m geo_short.build "$s" --require-tts
          done

      # 失敗しても、描いた AI イラストやナレーションは次回に持ち越す (無料枠を無駄にしない)
      - name: Save assets and narration
        if: always() && steps.pick.outputs.scripts != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/geo_short
          key: geo-short-assets-v3-${{ github.run_id }}

      - name: Save drawn art
        if: always() && steps.pick.outputs.scripts != ''
        run: python tools/art_cache.py save

      - name: Upload videos
        if: steps.pick.outputs.scripts != ''
        uses: actions/upload-artifact@v4
        with:
          name: geo-short-videos
          path: |
            out/*.mp4
            out/*_post.txt

      # 完成した動画を renders ブランチにも置く (ブラウザや別の環境から取り出しやすいように)
      - name: Publish to renders branch
        if: steps.pick.outputs.scripts != ''
        run: |
          mkdir -p /tmp/renders && cp out/*.mp4 /tmp/renders/
          cp out/*_post.txt /tmp/renders/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin renders; then
            git checkout -q -B renders FETCH_HEAD
          else
            git checkout -q --orphan renders
            git rm -rfq .
          fi
          git clean -fdxq
          cp /tmp/renders/* .
          git add -f -- *.mp4 $(ls *_post.txt 2>/dev/null)
          git commit -qm "render: ${{ steps.pick.outputs.scripts }} (${GITHUB_SHA::7})" || exit 0
          for i in 1 2 3; do
            git push -q origin renders && break
            git fetch -q origin renders && git rebase -q FETCH_HEAD
          done
