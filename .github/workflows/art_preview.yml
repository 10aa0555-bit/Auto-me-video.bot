name: AI art preview

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/art_preview.json"
      - "tools/art_preview.py"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq libcairo2-dev pkg-config
          pip install -q -r geo_short/requirements.txt
      - env:
          CF_ACCOUNT_ID: 4c5c855831c1a7f3ce3d0fa80b9c0d0d  # Cloudflare のアカウント ID (秘密の値ではない)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/art_preview.py tools/art_preview.json previews
      # 試し描きした絵を art-previews ブランチに置く
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r previews /tmp/previews
          git checkout -q --orphan art-previews && git rm -rfq . && git clean -fdxq
          cp /tmp/previews/* . && git add -f -- *.png
          git commit -qm "art preview (${GITHUB_SHA::7})" && git push -fq origin art-previews
